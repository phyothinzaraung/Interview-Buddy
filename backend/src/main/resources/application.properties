spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview_buddy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPENAI_API_KEY}

app.security.jwt-secret-base64=${JWT_SECRET_BASE64}
app.security.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:5173}
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=7d
